# SeaGrid: TOATE pragurile, punctajele și parametrii numerici stau aici.
# Codul nu conține numere magice; orice valoare nouă se adaugă în acest fișier.
# Unități: distanțe în km, viteze în noduri (kn), durate în minute, dacă nu e specificat altfel.

scenario:
  start: "2026-03-15T06:00:00Z"   # începutul timpului simulat (UTC)
  duration_min: 360
  report_interval_s: 60           # cadența mesajelor AIS sintetice
  seeds:
    tuning: 42                    # se folosește la reglarea pragurilor
    reporting: 1337               # held-out: doar raportare, niciodată reglare
  # Zona de acoperire AIS (bbox). Navele care ies din ea nu sunt "dark".
  coverage_bbox: {lat_min: 43.55, lat_max: 44.95, lon_min: 28.55, lon_max: 30.90}

# Zone geografice pentru datele REALE (modul live). Scenariul demo sintetic rămâne pe scenario.coverage_bbox
# și pe assets/; o zonă cu `assets` își ia infrastructura și unitățile din assets/<assets>/.
# aisstream.io nu are receptor lângă Constanța (acoperirea vestică a Mării Negre se oprește la ~43.4°N, Balchik),
# deci AIS real se înregistrează efectiv doar în zona varna.
areas:
  constanta:
    name: "Constanța sector, Romanian Black Sea"
    bbox: {lat_min: 43.55, lat_max: 44.95, lon_min: 28.30, lon_max: 30.90}
    sea_seed: [44.20, 29.80]      # [lat, lon] în larg: alege fața "mare" din linia de coastă (sar/landmask.py)
  varna:
    name: "Varna sector, Bulgarian Black Sea"
    bbox: {lat_min: 42.65, lat_max: 43.55, lon_min: 27.85, lon_max: 29.30}
    sea_seed: [43.10, 28.70]
    assets: areas/varna           # infrastructură și unități de patrulare proprii (relativ la assets/)

live:                             # data/aisstream.py, data/recorded.py
  area: varna                     # zona activă; variabila de mediu SEAGRID_AREA o suprascrie
  stream_url: "wss://stream.aisstream.io/v0/stream"
  flush_every_s: 30               # cât de des se scriu pe disc mesajele primite
  idle_timeout_s: 120             # niciun mesaj atâta timp => reconectare
  reconnect_min_s: 5
  reconnect_max_s: 300
  static_days_before: 7           # rapoartele statice (nume, tip, lungime) se caută cu N zile în urmă
  # Hărți învățate din înregistrare (data/recorded.py): unde se recepționează AIS și unde stau navele ancorate.
  coverage_history_days: 14
  coverage_cell_deg: 0.05         # grila acoperirii de recepție
  coverage_min_messages: 20       # o celulă e "acoperită" cu cel puțin N mesaje ...
  coverage_min_vessels: 2         # ... de la cel puțin M nave, pe toată înregistrarea ...
  coverage_min_hours: 3           # ... în cel puțin atâtea ore diferite (nu o rafală a unei flotile trecătoare)
  anchorage_cell_deg: 0.02        # ancoraje învățate: celule unde multe nave stau pe loc
  anchorage_max_sog_kn: 0.5
  anchorage_min_vessels: 3
  # core/live.py: pipeline-ul pe ceasul real
  tick_s: 60                      # secunde reale între două batch-uri
  window_min: 180                 # cât istoric recent arată pagina
  lookback_min: 120               # AIS încărcat înaintea ferestrei (reguli care privesc înapoi: gaură, loitering)
  zones_refresh_min: 60           # cât de des se reînvață acoperirea și ancorajele

sar:                              # sar/: radar Sentinel-1 (imagini reale, Microsoft Planetary Computer, fără cont)
  stac_url: "https://planetarycomputer.microsoft.com/api/stac/v1"
  collection: "sentinel-1-grd"
  coastline_urls:                 # OpenStreetMap natural=coastline (mască de uscat), API Overpass; se încearcă pe rând
    - "https://overpass-api.de/api/interpreter"
    - "https://overpass.private.coffee/api/interpreter"
    - "https://overpass.kumi.systems/api/interpreter"
  coastline_attempts: 3           # încercări pe fiecare server (Overpass e des ocupat: 429/504)
  coastline_margin_deg: 0.05      # cerere puțin mai mare decât zona, ca linia de coastă să-i taie marginile
  pixel_m: 20                     # grila de analiză (metri la sol)
  min_area_coverage: 0.15         # se ignoră trecerile care acoperă mai puțin din zonă
  land_buffer_m: 250              # pixelii mai aproape de uscat de atât sunt mascați (diguri, cheiuri)
  cfar:                           # detecție de nave: CFAR cu doi parametri pe clutter-ul local al mării
    background_px: 41             # latura ferestrei de fond (pixeli)
    guard_px: 9                   # latura ferestrei de gardă, exclusă din fond
    k_sigma: 6.0                  # candidat: I > medie + k * abatere standard
    min_ratio_db: 6.0             # ... și cel puțin atât peste media locală
    seed_ratio_db: 10.0           # o țintă are cel puțin un pixel atât de luminos
  min_pixels: 3
  min_length_m: 25
  max_length_m: 450               # mai mari nu sunt nave (margini de pete, uscat, siaj)
  merge_distance_m: 120           # candidați mai apropiați de atât = o singură țintă
  chip_px: 48                     # decupajul radar al fiecărei ținte (afișare)
  image_max_side_px: 4000         # plafonul imaginii radar afișate
  fixed:                          # structuri fixe (platforme, geamanduri, epave) apar la fiecare trecere
    lookback_days: 30
    passes: 4                     # treceri anterioare comparate
    radius_m: 200
    min_hits: 2                   # în același loc pe cel puțin N treceri anterioare => fixă
    platform_radius_m: 600        # atât de aproape de o platformă cunoscută => fixă
  watch_interval_min: 10          # python -m sar.process --watch: cât de des se întreabă catalogul

generator:                        # data/generate.py
  n_transit_inbound: 5
  n_transit_outbound: 3
  n_through: 4
  n_anchored: 5
  speed_kn_min: 9.0
  speed_kn_max: 14.0
  approach_speed_kn: 6.0          # viteză în coridorul de apropiere
  anchored_max_sog_kn: 0.4
  position_noise_km: 0.02
  sog_noise_kn: 0.3
  cog_noise_deg: 2.0
  dropout_probability: 0.004      # probabilitate pe mesaj de a începe o pauză scurtă normală
  dropout_min_s: 120
  dropout_max_s: 540              # sub speed_consistency.min_gap_min
  departure_window_min: 120       # navele plecate pornesc în primele N minute
  # Trafic lent NORMAL (testează alarmele false): traulere pe platoul continental și o pilotină la port.
  n_fishing: 3
  fishing_speed_kn_min: 4.0       # viteză de traulare; peste pragurile de loitering/rendezvous chiar cu zgomot
  fishing_speed_kn_max: 4.6
  fishing_tow_km: 8.0             # lungimea unei trageri (linie dreaptă), apoi întoarcere
  fishing_tow_spacing_km: 0.8     # distanța dintre trageri paralele
  fishing_min_separation_km: 6.0  # traulerele pornesc departe unul de altul
  n_pilot: 1
  pilot_speed_kn: 14.0
  pilot_berth_min: 30             # cât stă pilotina la dană între ieșiri
  pilot_hold_min: 15              # cât așteaptă la intrarea în coridor nava de pilotat
  pilot_hold_sog_kn: 1.5
  pilot_hold_radius_km: 0.2
  pilot_hold_inset_km: 1.5        # punctul de așteptare e în coridor, spre port față de intrare

injector:                         # data/inject.py
  random_anomalies:               # anomalii suplimentare, alese din seed, pentru evaluare
    ais_gap: 1
    position_jump: 1
    loitering: 1
    rendezvous: 1
    identity_spoofing: 1            # clonă a transponderului, emisie simultană la distanță
  random_gap_min: 90
  random_jump_km: 25.0
  random_loiter_min: 90
  random_loiter_sog_kn: 0.8
  random_margin_min: 60           # anomaliile aleatoare nu încep/termină la marginea scenariului
  edge_safety_km: 25.0            # anomaliile aleatoare stau departe de marginea acoperirii
  random_ship_types: [cargo, tanker]  # anomaliile aleatoare se pun doar pe aceste tipuri de nave

detect:
  gap:
    threshold_min: 30             # now - ultimul_mesaj > prag => ais_gap
    edge_margin_km: 15.0          # ignoră navele dispărute lângă marginea acoperirii
    min_uncertainty_speed_kn: 5.0 # viteza minimă folosită pentru zona de incertitudine
    min_messages_last_hour: 6     # doar o navă care transmitea regulat poate "dispărea"
  speed_consistency:
    min_gap_min: 15               # se verifică doar la reapariție după o pauză > N min
    min_expected_kn: 3.0          # sub această viteză raportată nu putem judeca "prea lent"
    history_min: 30               # viteza așteptată = mediana SOG din ultimele N min dinainte de pauză
    ratio_too_slow: 0.5           # implied / reported < 0.5 => prea lent
    ratio_too_fast: 1.5           # implied / reported > 1.5 => prea rapid
    stationary_max_implied_kn: 4.0  # navă oprită care "a sărit" mai repede de atât => prea rapid
  loitering:
    window_min: 45
    min_coverage_ratio: 0.8       # fereastra trebuie acoperită de date în proporție de 80%
    min_messages: 20
    max_mean_sog_kn: 3.0
    max_extent_km: 3.0            # diagonala bbox-ului pozițiilor din fereastră
    max_moored_sog_kn: 0.3        # o navă atât de nemișcată e ancorată/acostată, nu în loitering
  position_jump:
    max_dt_min: 10                # doar perechi consecutive apropiate în timp
    max_implied_kn: 50.0
  rendezvous:
    max_distance_km: 1.0          # distanța maximă dintre două nave pentru întâlnire suspectă (STS)
    max_sog_kn: 3.5               # viteza maximă pentru manevră de întâlnire
    min_duration_min: 15.0        # durata minimă a apropierii
    time_window_min: 5.0          # toleranță temporală între rapoarte
    min_messages: 4               # rapoarte apropiate minime pentru fiecare navă din pereche
    max_moored_sog_kn: 0.3        # ambele nave atât de nemișcate => ancorate alături, nu rendezvous
    ignore_pair_types: [fishing]  # două nave de pescuit împreună (traul în pereche, flotilă) nu sunt un transfer STS
  identity_spoofing:
    min_distance_km: 15.0         # distanță minimă între poziții simultane/aproape simultane
    max_dt_min: 3.0               # ecart maxim de timp între două rapoarte
    min_implied_kn: 120.0         # viteză fizic imposibilă între două rapoarte apropiate în timp
  sar:                            # detect/sar_rules.py: ținte radar <-> AIS la momentul imaginii
    max_interp_gap_min: 30        # interpolare între două poziții AIS aflate la cel mult atât
    max_extrapolate_min: 20       # extrapolare (dead reckoning) din cea mai apropiată poziție, cel mult atât
    gate_km: 1.0                  # raza de bază a asocierii țintă-navă
    gate_km_per_min_extrap: 0.08  # raza crește cu timpul de extrapolare
    doppler_gate_km: 0.6          # navele în mișcare apar deplasate în azimut pe imaginea SAR
    doppler_min_sog_kn: 3.0
    dark_min_coast_km: 0.5        # ținte neasociate mai aproape de coastă: clutter de port
    min_length_no_return_m: 80    # doar navele mari trebuie să apară sigur pe radar
    no_return_max_extrap_min: 5   # "AIS fără ecou radar" doar când poziția AIS e aproape sigură
    gap_min_silent_min: 30        # o țintă poate confirma o navă tăcută de cel puțin atât ...
    gap_lookback_min: 360         # ... și de cel mult atât
    gap_min_speed_kn: 5.0         # raza de incertitudine folosește cel puțin această viteză ...
    gap_speed_factor: 1.3         # ... înmulțită cu această marjă (nava poate accelera), plus gate_km
    max_age_h: 6                  # trecerile mai vechi de atât (față de now) nu mai deschid alerte
    recording_window_min: 10      # AIS trebuie să fi fost înregistrat în ± atâtea minute în jurul imaginii ...
    min_recording_messages: 20    # ... cel puțin atâtea mesaje; altfel țintele rămân neverificate (fără alerte)
  exclusion:
    # Zonele din assets/infrastructure.geojson cu proprietatea "exclusion": true
    applies_to: [loitering, ais_gap, rendezvous, speed_inconsistency, sar_dark_target]
    port_buffer_km: 2.0           # doar pe date reale: mai aproape de coasta OSM de atât = activitate de port

acoustic:
  band_hz: [10.0, 200.0]          # banda de joasă frecvență
  frame_s: 1.0
  lowfreq_ratio_threshold: 0.6    # energie în bandă / energie totală
  min_rms: 0.01
  min_event_s: 3.0
  confidence_scale: 1.0
  # P1: Prag adaptiv față de zgomotul de fond
  adaptive_threshold: true        # calcul prag adaptiv în funcție de zgomotul de fond
  noise_floor_quantile: 0.25      # quantila pentru estimarea zgomotului ambiant (percentila 25)
  adaptive_margin: 0.25           # marjă peste pragul de zgomot ambiant
  max_adaptive_threshold: 0.85    # plafon maxim pentru pragul adaptiv
  # P1: Încredere din durată și intensitate; filtrare tranzitorii scurți
  transient_filter_s: 2.0         # ignorare tranzitorii mai scurți de atât
  confidence_weights:             # ponderi pentru calculul încrederii (sumă = 1.0)
    ratio: 0.5
    duration: 0.3
    rms: 0.2
  target_duration_s: 15.0         # durată țintă în secunde pentru scor durată 1.0
  target_rms: 0.15                # intensitate RMS țintă pentru scor RMS 1.0
  # P2: Benzi caracteristice (elice vs lanț ancoră)
  signatures:
    propeller_band_hz: [20.0, 75.0]     # armonice ax și cavitație elice
    anchor_chain_band_hz: [75.0, 180.0] # frecare și zgomot lanț ancoră
  save_spectrograms: true         # salvare spectrograme PNG pentru pitch și analiză

fusion:
  same_vessel_window_min: 240     # evenimentele aceleiași nave în N min => același incident
  context_radius_km: 15.0         # senzori (acustic, fibră) atașați unei alerte
  context_before_min: 60
  context_after_min: 180
  correlation_radius_km: 10.0     # altă navă suspectă în apropiere
  weak_event_types: [sar_dark_target_uncovered, ais_no_radar_return]  # nu fac suspectă o navă vecină
  infra_radius_km: 8.0

score:
  points:                         # scor aditiv, plafonat la max
    ais_gap: 25
    speed_inconsistency: 20
    loitering: 20                 # = score.alert_min: un loitering singur, departe de infrastructură, dă o alertă low
    position_jump: 20
    rendezvous: 25
    identity_spoofing: 30
    sar_gap_confirmation: 40      # radarul vede o țintă fără AIS în zona în care putea fi nava tăcută
    sar_dark_target: 35           # țintă radar de mărimea unei nave, fără AIS, unde AIS se recepționează
    sar_dark_target_uncovered: 10 # aceeași, dar unde recepția AIS nu e dovedită: tăcerea nu spune mult
    ais_no_radar_return: 15       # navă mare raportează o poziție sigură, radarul nu vede nimic acolo
    acoustic_lowfreq: 15
    fibre_vibration: 20
    near_infrastructure: 15
    correlated_vessel: 10
  max: 100
  alert_min: 20                   # sub acest scor nu se emite alertă
  levels:                         # pragul minim pentru fiecare nivel
    low: 0
    medium: 30
    high: 50
    critical: 75

patrol:
  recommend_min_level: high       # recomandăm o unitate de la acest nivel în sus
  one_alert_per_unit: true        # o unitate trimisă la o alertă nu mai e recomandată pentru alta
  track_step_min: 1               # rezoluția traseelor unităților de patrulare în timeline
  eta_update_min: 5               # punct nou în istoricul alertei când ETA-ul se schimbă cu cel puțin N min
  on_scene_km: 2.0                # unitatea la mai puțin de atât de țintă e "on scene" (ETA 0) și o însoțește

pipeline:
  replay_step_min: 5              # pasul ceasului simulat în modul replay (make demo)
  watch_interval_s: 3             # secunde reale între micro-batch-uri în --watch
  watch_sim_step_min: 5           # minute simulate avansate la fiecare micro-batch
  coord_decimals: 5
  track_min_interval_s: 30        # pistele afișate păstrează cel mult un punct la N secunde (AIS real e foarte des)

web:
  reload_interval_s: 3            # cât de des reîncarcă pagina timeline.json

eval:
  match_grace_min: 60             # o alertă contează pentru o anomalie dacă apare în [start, end + grace]
