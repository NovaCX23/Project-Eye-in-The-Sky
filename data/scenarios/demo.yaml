traffic:                       # geografia traficului normal (data/generate.py)
  port_berth: [44.160, 28.660]
  approach_entry: [44.130, 28.955]
  inbound_start_box: {lat_min: 43.75, lat_max: 44.55, lon_min: 29.30, lon_max: 30.60}
  outbound_exits:
    - [43.70, 30.90]
    - [44.30, 30.90]
