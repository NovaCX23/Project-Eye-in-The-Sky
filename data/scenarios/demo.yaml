  - {offset_min: 150, near: [44.258, 29.470], amplitude: 0.9, confidence: 0.8, note: "strong vibration"}
  - {offset_min: 170, near: [44.259, 29.480], amplitude: 0.8, confidence: 0.75, note: "repeated vibration"}

expected:                      # folosit de skill-ul demo-check (minute de la start, termen maxim)
