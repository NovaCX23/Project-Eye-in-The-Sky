dark_vessel:                   # nava cargo care închide AIS 2 ore lângă platformă și cablu
  mmsi: "636012345"
  name: "MV SEA FALCON"
  ship_type: cargo
  speed_kn: 12.0
  start: [44.100, 29.880]
  last_seen: [44.255, 29.530]  # ultima poziție înainte de gaură (lângă PLT-N și CABLE-1)
  gap_start_min: 90
  gap_duration_min: 120
  reappear: [44.235, 29.330]   # prea aproape pentru 2 ore la 12 kn => "prea lent"

loiter_vessel:                 # a doua navă, AIS pornit, viteză mică în aceeași zonă
  mmsi: "667001234"
  name: "FV NORTHERN DAWN"
  ship_type: fishing
  appear_min: 10
  start: [44.360, 29.700]
  transit_speed_kn: 9.0
  center: [44.275, 29.440]
  loiter_duration_min: 180
  loiter_sog_kn: 0.8
  loiter_radius_km: 0.4
  exit: [44.550, 30.100]
  exit_speed_kn: 10.0

fibre_events:                  # senzor fibră (DAS) pe CABLE-1, SIMULAT de injector
